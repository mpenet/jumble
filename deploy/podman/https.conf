# Appended to jumble.container by deploy.sh (MODE=https, the default): Jumble
# serving HTTPS itself, with a certificate for JUMBLE_BASE_URL's host from
# Let's Encrypt, HTTP/3 included; plain http answers the CA and redirects to
# https.
[Container]
# The ports people reach, inside the container too: HTTP/3 is offered
# (Alt-Svc) on the port the app listens on.
Environment=JUMBLE_PORT=80 JUMBLE_HTTPS_PORT=443 JUMBLE_CERTIFICATES_DIR=/data/certificates
# Lets the app's unprivileged user listen on 80 and 443, in its own network
# namespace only, with no capability added.
Sysctl=net.ipv4.ip_unprivileged_port_start=80
PublishPort=80:80
PublishPort=443:443
PublishPort=443:443/udp
