# Appended to jumble.container by deploy.sh (MODE=own-proxy): Jumble behind a
# reverse proxy of your own, plain HTTP on this machine's loopback, for a
# proxy on the same server. For a proxy elsewhere, publish on the private
# address it reaches instead (see the deployment guide).
[Container]
PublishPort=127.0.0.1:8080:8080
# Each client's address from the X-Forwarded-For header the proxy adds.
Environment=JUMBLE_BEHIND_PROXY=true
