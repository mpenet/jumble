# Keeps pinned versions current: base images in the Dockerfile, the
# development services in the Compose file next to it, and the GitHub
# Actions used by the workflows and their local actions, all pinned by
# digest or commit.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A new Java version is moved to in the build, the runtime and CI
    # together, by hand.
    ignore:
      - dependency-name: clojure
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
