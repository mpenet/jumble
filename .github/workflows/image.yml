# Tests every change: unit tests and lint, then the image against the
# development services (integration tests, backups restored end to end). On
# main, a job of its own pushes that same image to GHCR, where
# deploy/deploy.sh runs it from by digest: only that job can push, and it
# runs none of the repository's code. Actions are pinned by commit
# (Dependabot proposes updates).
name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch: a newer push supersedes a pull request's run in
# progress. On main a run in progress finishes; one still waiting gives way
# to a newer push, whose image includes its changes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same as dev/check.sh before a push: tests, lint, and the deploy
      # scripts and units with Ubuntu 24.04's shellcheck and Podman, as on
      # servers.
      - name: Tests, lint, deploy scripts and units
        run: dev/check.sh

  integration:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Development services
        run: |
          docker compose up -d garage mailpit dex pebble
          dev/s3-init.sh
      - name: Integration tests
        run: clojure -M:test:integration
      # Built once: the image checked here is the one pushed.
      - name: Image
        run: >-
          docker buildx build --load --platform linux/amd64 -t jumble:dev
          --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Backups restore
        run: dev/backup-restore-check.sh jumble:dev
      - name: Keep the image
        if: github.event_name == 'push'
        run: docker save jumble:dev | gzip -1 >jumble.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: image
          path: jumble.tar.gz
          retention-days: 1

  push:
    needs: integration
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Load
        run: gunzip -c jumble.tar.gz | docker load --quiet
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          for tag in "$GITHUB_SHA" main; do
            docker tag jumble:dev "$REPOSITORY:$tag"
            docker push --quiet "$REPOSITORY:$tag"
          done
          # In the log as well: gh run view --log | grep IMAGE=
          echo "IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$GITHUB_SHA")" | tee -a "$GITHUB_STEP_SUMMARY"
